services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: commuteshare
      POSTGRES_USER: commuteshare
      POSTGRES_PASSWORD: commuteshare
    ports:
      - "5435:5432"
    volumes:
      - commuteshare_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U commuteshare -d commuteshare
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6381:6379"
    volumes:
      - commuteshare_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  commuteshare_postgres_data:
  commuteshare_redis_data:
