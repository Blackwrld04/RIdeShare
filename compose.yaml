services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: commuteshare
      POSTGRES_USER: commuteshare
      POSTGRES_PASSWORD: commuteshare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U commuteshare -d commuteshare
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: commuteshare
      MINIO_ROOT_PASSWORD: commuteshare-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 10
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - mc alias set local http://minio:9000 commuteshare commuteshare-local-secret && mc mb --ignore-existing local/commuteshare-private
volumes:
  minio_data:
  postgres_data:
  redis_data:
